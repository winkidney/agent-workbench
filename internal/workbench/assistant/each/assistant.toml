# {{.Name}}: settings Agent Workbench reads. After editing, run
# `agent-workbench assistant reload` (or Reload assistants in Moss's menu).
name = {{printf "%q" .Name}}
# claude or codex
agent = {{printf "%q" .Agent}}
# per-task: every request or routine run starts a new session (a topic).
# continuous: one ongoing conversation, a new session each day or when its
# context fills; state/handoff.md carries over.
sessions = {{printf "%q" .Sessions}}
# state: this assistant keeps state/ and log.md. wiki: it also maintains
# ../shared/wiki from its conversations.
memory = {{printf "%q" .Memory}}
# Its icon in the page, with its agent as a badge: camera (the default),
# mail, review, video, calendar, bell, globe, chart, book, chat, doc or
# toolbox; or a square .png in this folder (Settings → Assistants uploads
# one as icon.png).
# icon = "camera"
# What the page shows about it (its home card): one line on what it does,
# what it can do, and requests to try. Keep them true when the procedure
# changes.
{{if .Main -}}
description = {{printf "%q" .Description}}
capabilities = {{.CapabilitiesTOML}}
examples = {{.ExamplesTOML}}
# Set up and working.
ready = true
{{- else -}}
description = ""
capabilities = []
examples = []
# What it needs from you: a signed-in CLI (gh), an MCP server, an API token,
# an account. The page shows it; setup asks for it, one step at a time.
requires = []
# false until its setup is done: the page offers to set it up.
ready = false
{{- end}}
{{if .Main}}
# Its sessions' model and effort (also mode, permissions), per agent; what
# a table leaves out follows Settings → Agents. Its Settings change them.
# [options.claude]
# model = "opus"
# effort = "high"

[[routines]]
name = "Daily check"
daily = "08:30"
message = "Check state/loops.md: what is due today or overdue, and what needs me. Keep it short."

[[routines]]
name = "Weekly wiki check"
daily = "10:00"
days = ["sun"]
message = "Check ../shared/wiki as AGENTS.md says under Lint, fix what you can, and ask me about the rest."

# Prints nothing when every folder is committed and in step with origin, so
# most evenings nobody is woken (AGENTS.md, Repository sync).
[[routines]]
name = "Repository sync"
daily = "22:00"
command = "uv run tools/repo_sync.py"
message = "The repository of assistants has uncommitted changes or is out of step with its remote (below). Handle it as AGENTS.md says under Repository sync."
{{else}}
# Its sessions' model and effort (also mode, permissions), per agent; what
# a table leaves out follows Settings → Agents. Its Settings change them.
# [options.claude]
# model = "opus"
# effort = "high"

# A routine sends this assistant a message, runs a command in this folder,
# or runs a command and sends what it printed (only when it printed
# something). Schedules: daily = "HH:MM" (days = ["mon", "fri"]),
# every = "30m" / "2h" / "1d", at = "2026-12-01 09:00" (once), or
# cron = "0 9 1 * *" (minute hour day month weekday, local time; "@weekly").
#
# [[routines]]
# name = "Friday report"
# daily = "17:00"
# days = ["fri"]
# message = "Draft this week's report and ask me to approve it."
#
# [[routines]]
# name = "Check for new items"
# every = "30m"
# command = "uv run tools/check.py"
# message = "Sort these and tell me what needs me."
#
# background = true hands the message (and what the command printed) to a
# run nobody watches, not to a session: for outside content such as mail.
# It can only read and edit files here; the workbench commits its changes.
# [[routines]]
# name = "Sort new mail"
# every = "30m"
# command = "uv run tools/fetch.py"
# message = "Sort these into state/inbox.md as .agents/skills says."
# background = true
{{end}}
